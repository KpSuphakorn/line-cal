name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Web App test dependencies
      run: npm ci

    - name: Run Pytest Test Suite
      run: |
        pytest -v

    - name: Run Web App Test Suite
      run: npm test

    - name: Verify Alembic migrations
      run: |
        rm -f /tmp/line-cal-ci.db
        DATABASE_URL=sqlite:////tmp/line-cal-ci.db alembic upgrade head
