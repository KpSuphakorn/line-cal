<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ตารางเวท & แก้ไขน้ำหนัก | Workout Routine Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #3B82F6;
      --accent-emerald: #10B981;
      --accent-purple: #8B5CF6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 100px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
    }

    /* Glass Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .user-badge {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60A5FA;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    /* Tab Selector */
    .tabs-container {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: #FFFFFF;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-color: #3B82F6;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }

    /* Routine Details Header */
    .split-meta {
      padding: 0 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .split-title {
      font-size: 1rem;
      font-weight: 600;
      color: #E2E8F0;
    }

    .split-burn {
      font-size: 0.8rem;
      color: #34D399;
      background: rgba(16, 185, 129, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Exercise List */
    .exercise-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      position: relative;
    }

    .exercise-card:focus-within {
      border-color: rgba(59, 130, 246, 0.6);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .exercise-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .target-tag {
      font-size: 0.7rem;
      color: #93C5FD;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 2px 8px;
      border-radius: 6px;
      border: none;
      outline: none;
      text-align: right;
    }

    .card-main {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exercise-name-input {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      outline: none;
    }

    .weight-controller {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #334155;
      color: #F8FAFC;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .step-btn:active {
      background: #475569;
      transform: scale(0.95);
    }

    .weight-input {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      color: #60A5FA;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #EF4444;
      opacity: 0.7;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 6px;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    /* Add Exercise Button */
    .add-btn {
      margin-top: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(59, 130, 246, 0.4);
      background: rgba(59, 130, 246, 0.05);
      color: #60A5FA;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background: rgba(59, 130, 246, 0.12);
      border-color: #3B82F6;
    }

    /* Bottom Floating Action Bar */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .save-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .save-btn:active {
      transform: scale(0.98);
    }

    .close-btn {
      padding: 14px 20px;
      border-radius: 14px;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">
    <span>✅</span> <span id="toast-text">บันทึกเรียบร้อยแล้ว</span>
  </div>

  <!-- Header -->
  <header class="header">
    <div>
      <div class="header-title">
        <span>🏋️‍♂️</span> Workout Routine
      </div>
      <div class="header-sub">ปรับแก้ตารางและน้ำหนักที่เล่นเวท</div>
    </div>
    <div class="user-badge" id="userBadge">Suphakorn</div>
  </header>

  <!-- Split Tabs -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('day_1')">🔴 Day 1: Push</button>
    <button class="tab-btn" onclick="switchTab('day_2')">🔵 Day 2: Pull</button>
    <button class="tab-btn" onclick="switchTab('day_3')">🟢 Day 3: Lower</button>
    <button class="tab-btn" onclick="switchTab('day_4')">🟣 Day 4: Upper</button>
  </div>

  <!-- Routine Meta Header -->
  <div class="split-meta">
    <div class="split-title" id="currentSplitName">Day 1: Push (อก / ไหล่ / หลังแขน)</div>
    <div class="split-burn" id="currentSplitBurn">~300 kcal</div>
  </div>

  <!-- Dynamic Exercise Cards -->
  <div class="exercise-list" id="exerciseContainer">
    <!-- Populated by JS -->
  </div>

  <div style="padding: 0 16px;">
    <button class="add-btn" onclick="addExercise()">
      <span>➕</span> เพิ่มท่าออกกำลังกายใหม่
    </button>
  </div>

  <!-- Fixed Bottom Bar -->
  <div class="footer-bar">
    <button class="save-btn" onclick="saveAllRoutines()">
      <span>💾</span> บันทึกการเปลี่ยนแปลง
    </button>
    <button class="close-btn" onclick="handleClose()">ปิด</button>
  </div>

  <script>
    // User State
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || 'suphakorn';
    document.getElementById('userBadge').innerText = userId === 'suphakorn' ? 'Suphakorn' : 'User';

    let currentSplitId = 'day_1';
    let splitsData = {};

    // Fetch user exercises from backend
    async function loadUserExercises() {
      try {
        const res = await fetch(`/api/user/${userId}/exercises`);
        if (res.ok) {
          splitsData = await res.json();
          renderCurrentTab();
        } else {
          showToast('ไม่สามารถโหลดข้อมูลได้', '#EF4444');
        }
      } catch (err) {
        console.error(err);
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', '#EF4444');
      }
    }

    function switchTab(splitId) {
      currentSplitId = splitId;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        const ids = ['day_1', 'day_2', 'day_3', 'day_4'];
        btn.classList.toggle('active', ids[idx] === splitId);
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const split = splitsData[currentSplitId];
      if (!split) return;

      document.getElementById('currentSplitName').innerText = split.name;
      document.getElementById('currentSplitBurn').innerText = `~${split.estimated_burn_kcal} kcal`;

      const container = document.getElementById('exerciseContainer');
      container.innerHTML = '';

      split.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="exercise-num">ท่าที่ ${idx + 1}</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="text" class="target-tag" value="${ex.target || 'เป้าหมาย'}" 
                     onchange="updateTarget(${idx}, this.value)" placeholder="กล้ามเนื้อ">
              <button class="delete-btn" onclick="deleteExercise(${idx})" title="ลบท่านี้">🗑️</button>
            </div>
          </div>
          <div class="card-main">
            <input type="text" class="exercise-name-input" value="${ex.name}" 
                   onchange="updateName(${idx}, this.value)" placeholder="ชื่อท่า">
            <div class="weight-controller">
              <button class="step-btn" onclick="stepWeight(${idx}, -2.5)">−</button>
              <input type="text" class="weight-input" value="${ex.weight}" 
                     onchange="updateWeightDirect(${idx}, this.value)" placeholder="น้ำหนัก เช่น 40 kg">
              <button class="step-btn" onclick="stepWeight(${idx}, 2.5)">+</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function stepWeight(idx, delta) {
      const ex = splitsData[currentSplitId].exercises[idx];
      const match = ex.weight.match(/([\d.]+)/);
      if (match) {
        let currentNum = parseFloat(match[1]);
        currentNum = Math.max(0, currentNum + delta);
        // Clean float representation
        const displayNum = Number.isInteger(currentNum) ? currentNum : currentNum.toFixed(1);
        ex.weight = `${displayNum} kg`;
      } else {
        ex.weight = delta > 0 ? "20 kg" : "10 kg";
      }
      renderCurrentTab();
    }

    function updateWeightDirect(idx, val) {
      splitsData[currentSplitId].exercises[idx].weight = val.trim();
    }

    function updateName(idx, val) {
      splitsData[currentSplitId].exercises[idx].name = val.trim();
    }

    function updateTarget(idx, val) {
      splitsData[currentSplitId].exercises[idx].target = val.trim();
    }

    function deleteExercise(idx) {
      splitsData[currentSplitId].exercises.splice(idx, 1);
      renderCurrentTab();
    }

    function addExercise() {
      splitsData[currentSplitId].exercises.push({
        name: "ท่าใหม่",
        weight: "20 kg",
        target: "กล้ามเนื้อ"
      });
      renderCurrentTab();
    }

    async function saveAllRoutines() {
      const btn = document.querySelector('.save-btn');
      btn.innerText = "⏳ กำลังบันทึก...";
      btn.disabled = true;

      try {
        const payload = {};
        for (const [splitId, split] of Object.entries(splitsData)) {
          payload[splitId] = split.exercises;
        }

        const res = await fetch(`/api/user/${userId}/exercises/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          showToast('✅ บันทึกตารางเวทสำเร็จแล้ว!');
        } else {
          showToast('❌ ไม่สามารถบันทึกได้', '#EF4444');
        }
      } catch (err) {
        console.error(err);
        showToast('❌ เกิดข้อผิดพลาดในการบันทึก', '#EF4444');
      } finally {
        btn.innerHTML = "<span>💾</span> บันทึกการเปลี่ยนแปลง";
        btn.disabled = false;
      }
    }

    function showToast(msg, bg = '#10B981') {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      toast.style.background = bg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function handleClose() {
      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.history.back();
      }
    }

    // Init LINE LIFF if present
    document.addEventListener("DOMContentLoaded", async () => {
      loadUserExercises();
      try {
        if (window.liff) {
          await liff.init({ liffId: "LIFF_APP" }).catch(() => {});
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
