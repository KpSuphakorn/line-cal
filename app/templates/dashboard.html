    .app-header{padding:calc(10px + var(--safe-top)) 14px 10px}.brand{display:flex;align-items:center;gap:9px}.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;box-shadow:0 3px 8px rgba(0,111,134,.2)}.app-header h1{font-size:20px}.header-copy{min-width:0}.header-copy .subtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{max-width:640px;padding:12px 14px}.card{border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(26,75,99,.06)}.button{border-radius:11px}.button:focus-visible,.bottom-nav button:focus-visible,.icon-button:focus-visible,.day:focus-visible{outline:3px solid rgba(0,111,134,.28);outline-offset:2px}.bottom-nav{height:calc(64px + var(--safe-bottom));background:rgba(255,255,255,.98)}.bottom-nav button{min-height:44px;padding:5px 2px}.bottom-nav button.active{box-shadow:inset 0 3px 0 var(--blue)}.bottom-nav .nav-icon{display:grid;place-items:center;height:23px;margin-bottom:2px}.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--input);color:var(--text);box-shadow:none}.icon-button .icon{width:19px;height:19px}.calendar-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin:-2px 0 10px}.calendar-title{text-align:center;white-space:nowrap;font-size:17px}.calendar-legend{display:flex;justify-content:center;gap:14px;margin:7px 0 10px;color:var(--muted);font-size:12px}.legend-item{display:inline-flex;align-items:center;gap:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%}.dot.food{background:var(--blue)}.dot.workout{background:var(--green)}.calendar{gap:4px}.calendar .weekday{font-size:12px;font-weight:650;padding:4px 0}.day{min-height:48px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:10px;background:var(--input)}.day.has-data{background:var(--blue-soft)}.day-number{font-size:14px;line-height:1.2}.day-markers{display:flex;align-items:center;gap:4px;height:10px}.day.empty{min-height:0}.day.selected{box-shadow:0 0 0 2px var(--blue)}.onboarding{padding:18px}.onboarding h2{margin-bottom:6px}.onboarding p{margin:0 0 14px;color:var(--muted)}.exercise-estimate .icon{color:var(--green);width:24px;height:24px}.entry-title{display:flex;align-items:center;gap:7px}.entry-title .icon{flex:none;color:var(--blue);width:18px;height:18px}.macro{padding:8px 0}.section-intro{font-size:14px}
    @media(max-width:380px){.content{padding-left:10px;padding-right:10px}.card{padding:14px}.calendar-head{gap:5px}.calendar-title{font-size:16px}.calendar-legend{gap:10px}.day{min-height:45px}.day-number{font-size:13px}.bottom-nav button{font-size:10px}}

    .content{padding:clamp(10px,3vw,24px);max-width:720px}.card{padding:clamp(14px,3vw,22px);margin-bottom:clamp(10px,2vw,16px)}.program{padding:0}.program-head{padding:14px 14px 10px}.program-body{padding:0 14px}.program-footer{padding:11px 14px}.exercise{padding:clamp(10px,2.5vw,14px)}
    .content{max-width:none;width:100%;padding-inline:clamp(12px,4vw,28px)}.content>*{min-width:0;width:100%}.card,.program{width:100%;min-width:0}.history-chart{width:100%;margin:16px 0 8px}.history-chart svg{display:block;width:100%;height:auto;overflow:visible}.history-chart-title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}.history-chart-title strong{font-size:16px}.history-chart-title span{color:var(--muted);font-size:12px}.history-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-bottom:12px}.history-nav .button{min-width:0;padding:8px}.history-nav-label{text-align:center;font-weight:700}.history-detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.history-detail-title{font-weight:700;color:var(--blue);margin-bottom:10px}.history-detail-body{padding-top:0}.chart-grid{stroke:var(--line);stroke-width:1}.chart-target{stroke:var(--orange);stroke-width:2;stroke-dasharray:5 4}.chart-bar{fill:var(--blue);rx:4}.chart-bar.has-data{fill:var(--blue)}.chart-label{fill:var(--muted);font-size:10px;text-anchor:middle}.chart-value{fill:var(--text);font-size:10px;text-anchor:middle;font-weight:700}

    @media(max-width:420px){.history-controls{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.summary-value{font-size:16px}.summary-label{font-size:10px}.program-head{align-items:flex-start}.program-head .actions{width:auto}.program-head .actions .button{flex:0 1 auto}.program-footer{flex-direction:column;align-items:stretch}.program-footer .button{width:100%}.exercise-details{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.exercise .field input{padding:10px 7px}.history-nav{gap:4px}.history-nav-label{font-size:13px}}

<body>
  <header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true">C</span><div class="header-copy"><h1>CalTrack</h1><div class="subtitle" id="headerDate"></div><div class="subtitle" id="headerUser"></div></div></div></header>
  <main>
    <section class="content active" id="tab-today"><div id="todayRoot">กำลังโหลดข้อมูลวันนี้...</div></section>
    <section class="content" id="tab-history"><div id="historyRoot">กำลังโหลดประวัติ...</div></section>
    <section class="content" id="tab-programs"><div id="programsRoot">กำลังโหลดโปรแกรม...</div></section>
    <section class="content" id="tab-profile"><div id="profileRoot">กำลังโหลดโปรไฟล์...</div></section>
  </main>
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <button type="button" data-tab="today"><span class="nav-icon" data-icon="today" aria-hidden="true"></span>วันนี้</button>
    <button type="button" data-tab="history"><span class="nav-icon" data-icon="calendar" aria-hidden="true"></span>ประวัติ</button>
    <button type="button" data-tab="programs"><span class="nav-icon" data-icon="workout" aria-hidden="true"></span>โปรแกรม</button>
    <button type="button" data-tab="profile"><span class="nav-icon" data-icon="user" aria-hidden="true"></span>โปรไฟล์</button>
  </nav>
  <div class="modal" id="modal" aria-hidden="true"><div class="sheet" id="modalSheet"></div></div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  const CONFIG=window.__LINE_CAL_CONFIG__||{},API=location.origin;
  let params=new URLSearchParams();
  let token='',profile=null,today=null,sessions=[],programs=[],cardioPresets=[],selectedDay=null;
  const $=id=>document.getElementById(id),text=value=>String(value??'');
  function node(tag,content='',className=''){const el=document.createElement(tag);if(className)el.className=className;if(content instanceof Node)el.append(content);else if(content!==undefined)el.textContent=content;return el}
  function button(label,handler,className='button secondary'){const b=node('button',label,className);b.type='button';b.addEventListener('click',handler);return b}
  const iconPaths={today:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h5M8 16h3"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/>',workout:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12M3 12h3M18 12h3"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>',food:'<path d="M6 3v8M4 3v5a2 2 0 0 0 4 0V3M6 8v13M16 3v18M16 3c2 2 3 5 0 7"/>',cardio:'<path d="m13 3-2 6h4l-2 6M7 21h10M9 17h6"/>',chevronLeft:'<path d="m15 5-7 7 7 7"/>',chevronRight:'<path d="m9 5 7 7-7 7"/>',chevronUp:'<path d="m5 15 7-7 7 7"/>',chevronDown:'<path d="m5 9 7 7 7-7"/>'};
  const CARDIO_CHOICES=[{value:'เดิน',label:'เดิน'},{value:'เดินชัน',label:'เดินชัน'},{value:'วิ่ง',label:'วิ่ง'},{value:'จักรยาน',label:'ปั่นจักรยาน'},{value:'ว่ายน้ำ',label:'ว่ายน้ำ'},{value:'อื่นๆ',label:'อื่นๆ'}];
  function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('class','icon');svg.setAttribute('aria-hidden','true');svg.innerHTML=iconPaths[name]||iconPaths.today;return svg}
  function iconButton(name,label,handler){const b=button('',handler,'icon-button');b.append(icon(name));b.setAttribute('aria-label',label);return b}
  function api(path,options={}){const headers=new Headers(options.headers||{});headers.set('Authorization',`Bearer ${token}`);return fetch(API+path,{...options,headers})}
  let toastTimer;
  function showToast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const n=node('div',message,'toast');n.setAttribute('role','status');document.body.append(n);toastTimer=setTimeout(()=>n.remove(),3200)}
  function setTab(raw){const tab=['today','history','programs','profile'].includes(raw)?raw:'today';if(raw!==tab){const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState({},'',u)}document.querySelectorAll('.content').forEach(el=>el.classList.toggle('active',el.id===`tab-${tab}`));document.querySelectorAll('.bottom-nav button').forEach(el=>{const active=el.dataset.tab===tab;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false')});if(tab==='today')loadToday();if(tab==='history')loadHistory();if(tab==='programs')loadPrograms();if(tab==='profile')loadProfile()}
  const PROFILE_REQUIRED_MESSAGE='กรุณาตั้งค่าโปรไฟล์ให้ครบก่อนเริ่มใช้งาน';
  function profileRequired(force=false){if(!force&&profile?.profile_completed)return true;setTab('profile');showToast(PROFILE_REQUIRED_MESSAGE);return false}
  function openModal(title,body,actions=[]){const sheet=$('modalSheet');sheet.replaceChildren();sheet.append(node('h2',title),body);const row=node('div','','actions modal-actions');actions.forEach(a=>row.append(a));sheet.append(row);document.body.classList.add('modal-open');$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false')}

  async function loadCapture(captureToken){if(!profileRequired())return;const response=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}`);if(!response.ok){showToast(await apiError(response));return}const capture=await response.json();if(capture.status!=='draft'){showToast('รายการอาหารนี้ยืนยันหรือยกเลิกไปแล้ว จึงแก้ไขไม่ได้');return}const items=capture.items||[],body=document.createElement('div');const render=()=>{body.replaceChildren();items.forEach((item,index)=>{const card=node('div','','card'),name=field('ชื่ออาหาร',item.food_name),portion=field('ปริมาณ',item.portion||'1 ที่'),kcal=field('kcal',item.calories,'number',{min:0,step:.1}),p=field('โปรตีน',item.protein,'number',{min:0,step:.1}),c=field('คาร์บ',item.carbs,'number',{min:0,step:.1}),f=field('ไขมัน',item.fat,'number',{min:0,step:.1});[name,portion,kcal,p,c,f].forEach(x=>card.append(x.wrap));card.append(button('ลบรายการ',()=>{items.splice(index,1);render()},'button danger'));body.append(card)});body.append(button('เพิ่มรายการ',()=>{items.push({food_name:'',portion:'1 ที่',calories:0,protein:0,carbs:0,fat:0});render()},'button secondary'))};render();openModal('ตรวจสอบรายการอาหาร',body,[button('ยกเลิก',async()=>{const cancelResponse=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}/cancel`,{method:'POST'});if(!cancelResponse.ok){showToast(await apiError(cancelResponse));return}closeModal()}),button('ยืนยันทั้งหมด',async()=>{const payload={items:[...body.querySelectorAll('.card')].map(card=>{const i=card.querySelectorAll('input');return{food_name:i[0].value.trim(),portion:i[1].value.trim()||'1 ที่',calories:Number(i[2].value)||0,protein:Number(i[3].value)||0,carbs:Number(i[4].value)||0,fat:Number(i[5].value)||0}}).filter(item=>item.food_name)};const update=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!update.ok){showToast(await apiError(update));return}const confirmResponse=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}/confirm`,{method:'POST'});if(!confirmResponse.ok){showToast(await apiError(confirmResponse));return}closeModal();loadToday()},'button')])}
