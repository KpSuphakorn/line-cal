<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LINE Cal</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151d32;--input:#202a45;--line:#2d3957;--text:#edf2fb;--muted:#9aa8c3;--blue:#4f8cff;--green:#18c58b;--orange:#f4a62a;--red:#f06a75;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-header{position:sticky;top:0;z-index:5;padding:18px 16px 14px;background:rgba(11,16,32,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}h1{margin:0;color:#6ee7f9;font-size:20px}.subtitle{color:var(--muted);font-size:12px}.content{display:none;padding:16px;max-width:720px;margin:auto}.content.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#263250;color:#c7d4ef;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px 8px;border-radius:12px;background:var(--input);text-align:center}.stat strong{display:block;font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px}.button{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700}.button.secondary{background:var(--input);border:1px solid var(--line);color:var(--text)}.button.danger{background:#5b2832;color:#ffd8dc}.button.link{background:transparent;color:#8bb2ff;padding:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin-bottom:11px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text)}.field textarea{min-height:70px;resize:vertical}.macro{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.macro:last-child{border-bottom:0}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry-main{min-width:0;flex:1}.entry-title{font-weight:700;overflow-wrap:anywhere}.entry-meta{color:var(--muted);font-size:12px}.entry-actions{display:flex;gap:5px;flex-shrink:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar .weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--text)}.day.empty{background:transparent;border:0}.day.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.day.has-data{background:#1d3154}.day small{display:block;color:#8cb1ff;font-size:9px}.program{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;background:var(--card)}.program-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.exercise{display:grid;grid-template-columns:minmax(0,1fr) 52px 58px 70px 70px 30px 30px;gap:5px;align-items:center;margin:7px 0}.exercise input{min-width:0;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--text)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.72)}.modal.open{display:flex}.sheet{width:100%;max-width:720px;max-height:92vh;overflow:auto;margin:auto auto 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0}.sheet h2{margin:0 0 14px}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:70px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(15,23,42,.97);border-top:1px solid var(--line);max-width:720px;margin:auto}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700}.bottom-nav button.active{color:#71e5f0;background:#173047}.bottom-nav span{display:block;font-size:20px}.empty{text-align:center;padding:22px;color:var(--muted)}.loading{text-align:center;padding:36px;color:var(--muted)}@media(max-width:430px){.exercise{grid-template-columns:minmax(0,1fr) 45px 48px 60px 60px 28px 28px;font-size:12px}.entry-actions .button{padding:7px 8px;font-size:11px}}
  </style>
</head>
<body>
  <header class="app-header"><h1>🔥 LINE Cal</h1><div class="subtitle" id="headerDate"></div><div class="subtitle" id="headerUser"></div></header>
  <main>
    <section class="content active" id="tab-today"><div id="todayRoot" class="loading">กำลังโหลดข้อมูลวันนี้...</div></section>
    <section class="content" id="tab-history"><div id="historyRoot" class="loading">กำลังโหลดประวัติ...</div></section>
    <section class="content" id="tab-programs"><div id="programsRoot" class="loading">กำลังโหลดโปรแกรม...</div></section>
    <section class="content" id="tab-profile"><div id="profileRoot" class="loading">กำลังโหลดโปรไฟล์...</div></section>
  </main>
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <button type="button" data-tab="today"><span>📊</span>Today</button>
    <button type="button" data-tab="history"><span>📅</span>History</button>
    <button type="button" data-tab="programs"><span>🏋️</span>Programs</button>
    <button type="button" data-tab="profile"><span>👤</span>Profile</button>
  </nav>
  <div class="modal" id="modal" aria-hidden="true"><div class="sheet" id="modalSheet"></div></div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  const CONFIG=window.__LINE_CAL_CONFIG__||{},params=new URLSearchParams(location.search),API=location.origin;
  let token='',profile=null,today=null,sessions=[],programs=[],monthly=null,selectedDay=null;
  const aliases={monthly:'history',workout:'programs',workouts:'programs',goals:'profile',goal:'profile'};
  const tabName=value=>aliases[value]||(['today','history','programs','profile'].includes(value)?value:'today');
  const $=id=>document.getElementById(id),text=value=>String(value??'');
  function node(tag,content='',className=''){const el=document.createElement(tag);if(className)el.className=className;if(content instanceof Node)el.append(content);else if(content!==undefined)el.textContent=content;return el}
  function button(label,handler,className='button secondary'){const b=node('button',label,className);b.type='button';b.addEventListener('click',handler);return b}
  function api(path,options={}){const headers=new Headers(options.headers||{});headers.set('Authorization',`Bearer ${token}`);return fetch(API+path,{...options,headers})}
  function showToast(message){const n=node('div',message,'notice');document.body.append(n);setTimeout(()=>n.remove(),2600)}
  function setTab(raw){const tab=tabName(raw);if(raw!==tab){const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState({},'',u)}document.querySelectorAll('.content').forEach(el=>el.classList.toggle('active',el.id===`tab-${tab}`));document.querySelectorAll('.bottom-nav button').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));if(tab==='today')loadToday();if(tab==='history')loadHistory();if(tab==='programs')loadPrograms();if(tab==='profile')loadProfile()}
  function profileRequired(){if(profile?.profile_completed)return true;setTab('profile');showToast('กรุณาตั้งค่า Profile ให้ครบก่อนบันทึกข้อมูล');return false}
  function openModal(title,body,actions=[]){const sheet=$('modalSheet');sheet.replaceChildren();sheet.append(node('h2',title),body);const row=node('div','','actions');actions.forEach(a=>row.append(a));sheet.append(row);$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false')}
  function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');$('modalSheet').replaceChildren()}
  $('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeModal()});
  function field(label,value='',type='text',options={}){const wrap=node('div','','field'),labelNode=node('label',label);const input=document.createElement(type==='select'?'select':type==='textarea'?'textarea':'input');if(type==='select'){for(const option of options.choices||[])input.append(node('option',option.label));input.value=value||''}else{if(type!=='textarea')input.type=type;input.value=value??'';if(options.step)input.step=options.step;if(options.min!==undefined)input.min=options.min;if(options.max!==undefined)input.max=options.max}wrap.append(labelNode,input);return {wrap,input}}
  function apiError(response){return response.json().catch(()=>({})).then(body=>body.detail||'ดำเนินการไม่สำเร็จ')}
  function bangkokDate(value){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value||Date.now()))}
  function formatTime(value){return value?new Date(value).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}):''}
  function section(title){const card=node('div','','card');card.append(node('h2',title));return card}
  function empty(message){return node('div',message,'empty')}
  function addActions(parent,items){const actions=node('div','','entry-actions');items.forEach(item=>actions.append(item));parent.append(actions)}

  async function init(){
    $('headerDate').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Bangkok'});
    if(!CONFIG.liffId||!window.liff){$('todayRoot').textContent='ต้องเปิด Web App ผ่าน LINE LIFF';return}
    try{await liff.init({liffId:CONFIG.liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}token=liff.getIDToken();if(!token)throw Error('LINE identity token unavailable');profile=await (await api('/api/me/profile')).json();$('headerUser').textContent=profile.name?`ผู้ใช้: ${profile.name}`:'';setTab(params.get('tab')||'today');if(params.get('capture_token'))loadCapture(params.get('capture_token'));if(params.get('cardio')==='1')openCardio()}catch(error){console.error(error);$('todayRoot').textContent='ยืนยันตัวตนไม่สำเร็จ กรุณาเปิดหน้านี้จาก LINE'}}
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

  function renderToday(data,sessionRows){const root=$('todayRoot');root.replaceChildren();const summary=section('วันนี้');const stats=node('div','','stats');[['เป้าอาหาร',data.food_target],['กินแล้ว',data.food_consumed],['ออกกำลังประมาณ',data.exercise_estimate]].forEach(([label,value])=>{const s=node('div','','stat');s.append(node('strong',`${Math.round(value||0).toLocaleString()} kcal`),node('span',label));stats.append(s)});summary.append(stats);summary.append(node('div',data.remaining_kcal>=0?`เหลือจากเป้า ${Math.round(data.remaining_kcal)} kcal`:`เกินเป้า ${Math.abs(Math.round(data.remaining_kcal))} kcal`,'notice'));[['โปรตีน',data.protein,data.target_protein],['คาร์บ',data.carbs,data.target_carbs],['ไขมัน',data.fat,data.target_fat]].forEach(([label,value,target])=>{const m=node('div','','macro');m.append(node('span',label),node('span',`${Math.round(value||0)} / ${Math.round(target||0)} g`));summary.append(m)});root.append(summary);
    const foods=section('รายการอาหาร');if(!data.food_logs?.length)foods.append(empty('ยังไม่มีรายการอาหารวันนี้\nส่งรูปหรือพิมพ์ “กิน <เมนู>” ใน LINE'));else data.food_logs.forEach(food=>foods.append(foodRow(food)));root.append(foods);
    const workouts=section('การออกกำลังกาย');const controls=node('div','','actions');controls.append(button('เลือกโปรแกรม',()=>{if(profileRequired())setTab('programs')},'button'));controls.append(button('บันทึก Cardio',()=>{if(profileRequired())openCardio()},'button secondary'));workouts.append(controls);const todaySessions=sessionRows.filter(s=>bangkokDate(s.occurred_at)===bangkokDate(new Date().toISOString()));if(!todaySessions.length)workouts.append(empty('ยังไม่มี Workout Session วันนี้'));else todaySessions.forEach(session=>workouts.append(sessionRow(session)));root.append(workouts)}
  function foodRow(food){const row=node('div','','entry'),main=node('div','','entry-main');main.append(node('div',food.name||'รายการอาหาร','entry-title'),node('div',`${food.time||''} • ${Math.round(food.calories||0)} kcal • P ${Math.round(food.protein||0)}g`,'entry-meta'));row.append(main);addActions(row,[button('แก้ไข',()=>openFoodEditor(food),'button link'),button('ลบ',()=>deleteFood(food.id),'button danger')]);return row}
  function sessionRow(session){const row=node('div','','entry'),main=node('div','','entry-main');main.append(node('div',`${session.type==='cardio'?'🏃':'🏋️'} ${session.name}`,'entry-title'),node('div',`${formatTime(session.occurred_at)} • ${Math.round(session.estimated_duration_min||0)} นาที • ประมาณ ${Math.round(session.estimated_calories||0)} kcal`,'entry-meta'));row.append(main);addActions(row,[button('แก้ไข',()=>openSessionEditor(session.id),'button link'),button('ลบ',()=>deleteSession(session.id),'button danger')]);return row}
  async function loadToday(){if(!token)return;const root=$('todayRoot');root.textContent='กำลังโหลดข้อมูลวันนี้...';try{const [summaryResponse,sessionResponse]=await Promise.all([api('/api/me/today'),api('/api/me/workout-sessions?limit=200')]);if(summaryResponse.status===409){profileRequired();return}if(!summaryResponse.ok)throw Error(await apiError(summaryResponse));today=await summaryResponse.json();sessions=sessionResponse.ok?(await sessionResponse.json()).sessions||[]:[];renderToday(today,sessions)}catch(error){root.textContent=`โหลดข้อมูลไม่สำเร็จ: ${error.message}`}}
  async function deleteFood(id){if(!confirm('ลบรายการอาหารนี้หรือไม่?'))return;const response=await api(`/api/me/food/${id}`,{method:'DELETE'});if(!response.ok){showToast(await apiError(response));return}loadToday();if(monthly)loadHistory()}
  function openFoodEditor(food){const body=document.createElement('div');const name=field('ชื่ออาหาร',food.name),portion=field('ปริมาณ',food.portion||'1 ที่'),kcal=field('แคลอรี',food.calories,'number',{min:0,step:.1}),protein=field('โปรตีน (g)',food.protein,'number',{min:0,step:.1}),carbs=field('คาร์บ (g)',food.carbs,'number',{min:0,step:.1}),fat=field('ไขมัน (g)',food.fat,'number',{min:0,step:.1});[name,portion,kcal,protein,carbs,fat].forEach(f=>body.append(f.wrap));openModal('แก้ไขรายการอาหาร',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const response=await api(`/api/me/food/${food.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({food_name:name.input.value,portion:portion.input.value,calories:Number(kcal.input.value),protein:Number(protein.input.value),carbs:Number(carbs.input.value),fat:Number(fat.input.value)})});if(!response.ok){showToast(await apiError(response));return}closeModal();loadToday();if(monthly)loadHistory()},'button')])}

  let historyYear=new Date().getFullYear(),historyMonth=new Date().getMonth()+1;
  async function loadHistory(){if(!token)return;const root=$('historyRoot');root.textContent='กำลังโหลดประวัติ...';try{const [monthResponse,sessionResponse]=await Promise.all([api(`/api/me/monthly?year=${historyYear}&month=${historyMonth}`),api('/api/me/workout-sessions?limit=200')]);if(monthResponse.status===409){profileRequired();return}if(!monthResponse.ok)throw Error(await apiError(monthResponse));monthly=await monthResponse.json();sessions=sessionResponse.ok?(await sessionResponse.json()).sessions||[]:sessions;renderHistory()}catch(error){root.textContent=`โหลดประวัติไม่สำเร็จ: ${error.message}`}}
  function renderHistory(){const root=$('historyRoot');root.replaceChildren();const card=section('ประวัติ');const head=node('div','','actions');head.style.justifyContent='space-between';head.append(button('เดือนก่อน',()=>{historyMonth--;if(historyMonth<1){historyMonth=12;historyYear--}loadHistory()}),node('strong',new Date(historyYear,historyMonth-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'})),button('เดือนถัดไป',()=>{historyMonth++;if(historyMonth>12){historyMonth=1;historyYear++}loadHistory()}));card.append(head);const cal=node('div','','calendar');['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(day=>cal.append(node('div',day,'weekday')));const days=monthly?.daily_breakdown||[];const first=new Date(historyYear,historyMonth-1,1).getDay();for(let i=0;i<first;i++)cal.append(node('div','','day empty'));days.forEach(day=>{const cell=button(String(Number(day.date.slice(-2))),()=>selectHistoryDay(day),'day');const daySessions=sessions.filter(s=>bangkokDate(s.occurred_at)===day.date);if(day.food_logs?.length||daySessions.length)cell.classList.add('has-data');cell.append(node('small',`${day.food_logs?.length||0} อาหาร · ${daySessions.length} ออกกำลัง`));if(selectedDay===day.date)cell.classList.add('selected');cal.append(cell)});card.append(cal);root.append(card);if(selectedDay){const day=days.find(item=>item.date===selectedDay);if(day)root.append(renderHistoryDay(day))}}
  function selectHistoryDay(day){selectedDay=day.date;renderHistory()}
  function renderHistoryDay(day){const card=section(`รายละเอียด ${day.date_display||day.date}`);card.append(node('div',`อาหาร ${Math.round(day.calories_in||0)} kcal • โปรตีน ${Math.round(day.protein||0)} g`,'notice'));(day.food_logs||[]).forEach(food=>card.append(foodRow(food)));const daySessions=sessions.filter(s=>bangkokDate(s.occurred_at)===day.date);if(daySessions.length)daySessions.forEach(session=>card.append(sessionRow(session)));else card.append(empty('ยังไม่มี Workout Session วันนี้'));return card}

  async function openSessionEditor(id){const response=await api(`/api/me/workout-sessions/${id}`);if(!response.ok){showToast(await apiError(response));return}const session=await response.json();const body=document.createElement('div');const name=field('ชื่อ Session',session.name),duration=field('ระยะเวลาโดยประมาณ (นาที)',session.estimated_duration_min,'number',{min:0,step:.1}),calories=field('พลังงานโดยประมาณ (แก้ได้)',session.estimated_calories,'number',{min:0,step:.1}),notes=field('หมายเหตุ',session.notes||'','textarea');[name,duration,calories,notes].forEach(f=>body.append(f.wrap));const exercises=node('div');session.exercises=session.exercises||[];const renderExercises=()=>{exercises.replaceChildren();if(session.type!=='strength'){exercises.append(node('div','Cardio แก้ไขได้จากค่าเวลาและพลังงานด้านบน','muted'));return}session.exercises.forEach((exercise,index)=>{const row=node('div','','exercise');const n=field('ชื่อ',exercise.name),s=field('เซ็ต',exercise.sets,'number',{min:0}),r=field('ครั้ง',exercise.repetitions,'number',{min:0}),w=field('กก.',exercise.weight??'','number',{min:0,step:.1}),note=field('หมายเหตุ',exercise.notes||'');row.append(n.input,s.input,r.input,w.input,note.input,button('×',()=>{session.exercises.splice(index,1);renderExercises()},'button danger'));exercises.append(row)})};body.append(node('h3','ท่าออกกำลังกาย'));renderExercises();body.append(exercises);if(session.type==='strength')body.append(button('เพิ่มท่า',()=>{session.exercises.push({name:'',sets:3,repetitions:10,weight:null,notes:''});renderExercises()},'button secondary'));openModal('แก้ไข Workout Session',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const exercisesPayload=[...exercises.querySelectorAll('.exercise')].map(row=>{const inputs=row.querySelectorAll('input');return{name:inputs[0].value.trim(),sets:Number(inputs[1].value)||0,repetitions:Number(inputs[2].value)||0,weight:inputs[3].value===''?null:Number(inputs[3].value),notes:inputs[4].value.trim()}}).filter(item=>item.name);const payload={name:name.input.value.trim(),notes:notes.input.value,estimated_duration_min:Number(duration.input.value)||0,estimated_calories:Number(calories.input.value)||0};if(session.type==='strength')payload.exercises=exercisesPayload;else if(session.cardio)payload.cardio={...session.cardio,duration_min:Number(duration.input.value)||session.cardio.duration_min};const result=await api(`/api/me/workout-sessions/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!result.ok){showToast(await apiError(result));return}closeModal();loadToday();loadHistory()},'button')])}
  async function deleteSession(id){if(!confirm('ลบ Workout Session นี้หรือไม่?'))return;const response=await api(`/api/me/workout-sessions/${id}`,{method:'DELETE'});if(!response.ok){showToast(await apiError(response));return}selectedDay=null;loadToday();loadHistory()}

  async function loadPrograms(){if(!token)return;const root=$('programsRoot');root.textContent='กำลังโหลดโปรแกรม...';try{const response=await api('/api/me/workout-programs');if(response.status===409){profileRequired();return}if(!response.ok)throw Error(await apiError(response));programs=(await response.json()).programs||[];renderPrograms()}catch(error){root.textContent=`โหลดโปรแกรมไม่สำเร็จ: ${error.message}`}}
  function renderPrograms(){const root=$('programsRoot');root.replaceChildren();const heading=section('Programs');heading.append(node('div','เลือกโปรแกรมเพื่อบันทึกทันที หรือแก้ไขรายการท่าได้ที่นี่','muted'),button('สร้างโปรแกรม',()=>openProgramEditor(),'button'),button('บันทึก Cardio',()=>{if(profileRequired())openCardio()},'button secondary'));root.append(heading);if(!programs.length){root.append(empty('ยังไม่มีโปรแกรม'));return}programs.forEach(program=>root.append(programCard(program)))}
  function programCard(program){const card=node('div','','program'),head=node('div','','program-head'),controls=node('div','','actions');head.append(node('h3',program.name));controls.append(button('แก้ไข',()=>openProgramEditor(program),'button link'),button('ลบ',()=>deleteProgram(program.id),'button danger'));head.append(controls);card.append(head);if(!program.exercises?.length)card.append(empty('ยังไม่มีท่า'));else program.exercises.forEach(exercise=>{const row=node('div','','entry'),main=node('div','','entry-main');main.append(node('div',exercise.name,'entry-title'),node('div',`${exercise.sets} เซ็ต × ${exercise.repetitions} ครั้ง${exercise.weight==null?'':` • ${exercise.weight} กก.`}`,'entry-meta'));row.append(main);card.append(row)});card.append(button('เล่นโปรแกรมนี้',()=>logProgram(program.id),'button'));return card}
  function renderProgramExercises(rows,container){container.replaceChildren();rows.forEach((exercise,index)=>{const row=node('div','','exercise');const name=field('ชื่อ',exercise.name),sets=field('เซ็ต',exercise.sets,'number',{min:0}),reps=field('ครั้ง',exercise.repetitions,'number',{min:0}),weight=field('กก.',exercise.weight??'','number',{min:0,step:.1}),notes=field('หมายเหตุ',exercise.notes||'');row.append(name.input,sets.input,reps.input,weight.input,notes.input,button('↑',()=>{if(index){[rows[index-1],rows[index]]=[rows[index],rows[index-1]];renderProgramExercises(rows,container)}},'button link'),button('↓',()=>{if(index<rows.length-1){[rows[index],rows[index+1]]=[rows[index+1],rows[index]];renderProgramExercises(rows,container)}},'button link'));row.append(button('×',()=>{rows.splice(index,1);renderProgramExercises(rows,container)},'button danger'));container.append(row)})}
  function openProgramEditor(program=null){const draft=JSON.parse(JSON.stringify(program||{name:'โปรแกรมใหม่',exercises:[]})),body=document.createElement('div'),name=field('ชื่อโปรแกรม',draft.name),list=node('div');body.append(name.wrap,node('p','ชื่อ · เซ็ต · ครั้ง · น้ำหนัก · หมายเหตุ','muted'),list);renderProgramExercises(draft.exercises,list);body.append(button('เพิ่มท่า',()=>{draft.exercises.push({name:'',sets:3,repetitions:10,weight:null,notes:''});renderProgramExercises(draft.exercises,list)},'button secondary'));openModal(program?'แก้ไขโปรแกรม':'สร้างโปรแกรม',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const payload={name:name.input.value.trim(),exercises:[...list.querySelectorAll('.exercise')].map(row=>{const i=row.querySelectorAll('input');return{name:i[0].value.trim(),sets:Number(i[1].value)||0,repetitions:Number(i[2].value)||0,weight:i[3].value===''?null:Number(i[3].value),notes:i[4].value.trim()}}).filter(item=>item.name)};if(!payload.name){showToast('กรุณาระบุชื่อโปรแกรม');return}const response=await api(program?`/api/me/workout-programs/${program.id}`:'/api/me/workout-programs',{method:program?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){showToast(await apiError(response));return}closeModal();loadPrograms()},'button')])}
  async function deleteProgram(id){const program=programs.find(item=>item.id===id);if(!program||!confirm(`ลบโปรแกรม ${program.name} หรือไม่?`))return;const response=await api(`/api/me/workout-programs/${id}`,{method:'DELETE'});if(!response.ok){showToast(await apiError(response));return}loadPrograms()}
  async function logProgram(id){if(!profileRequired())return;const response=await api('/api/me/workout-sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({program_id:id})});if(!response.ok){showToast(await apiError(response));return}showToast('บันทึก Workout Session แล้ว');setTab('today')}
  async function openCardio(){const body=document.createElement('div'),activity=field('กิจกรรม','เดินชัน'),duration=field('เวลา (นาที)','','number',{min:1,step:.5}),incline=field('ความชัน (%)','','number',{min:0,step:.1}),speed=field('ความเร็ว (กม./ชม.)','','number',{min:0,step:.1});[activity,duration,incline,speed].forEach(f=>body.append(f.wrap));openModal('บันทึก Cardio',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{if(!duration.input.value){showToast('กรุณาใส่เวลา');return}const payload={activity:activity.input.value,duration_min:Number(duration.input.value)};if(incline.input.value)payload.incline_pct=Number(incline.input.value);if(speed.input.value)payload.speed_kmh=Number(speed.input.value);const response=await api('/api/me/workout-sessions/cardio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){showToast(await apiError(response));return}closeModal();loadToday();loadHistory()},'button')])}

  async function loadProfile(){if(!token)return;const root=$('profileRoot');root.textContent='กำลังโหลดโปรไฟล์...';try{const response=await api('/api/me/profile');if(!response.ok)throw Error(await apiError(response));profile=await response.json();$('headerUser').textContent=profile.name?`ผู้ใช้: ${profile.name}`:'';renderProfile()}catch(error){root.textContent=`โหลดโปรไฟล์ไม่สำเร็จ: ${error.message}`}}
  function renderProfile(){const root=$('profileRoot');root.replaceChildren();const card=section('Profile');card.append(node('div',profile.profile_completed?'โปรไฟล์พร้อมใช้งาน':'กรอกข้อมูลให้ครบก่อนบันทึกอาหารหรือออกกำลังกาย','notice'));const body=document.createElement('div');const name=field('ชื่อที่แสดง',profile.name||''),age=field('อายุ',profile.age||'','number',{min:13,max:120}),gender=field('เพศที่ใช้คำนวณ',profile.gender||'male','select',{choices:[{label:'male'},{label:'female'}]}),height=field('ส่วนสูง (ซม.)',profile.height_cm||'','number',{min:80,max:250,step:.1}),weight=field('น้ำหนัก (กก.)',profile.weight_kg||'','number',{min:20,max:400,step:.1}),activity=field('ระดับกิจกรรม',profile.activity_level||'1.45','select',{choices:[{label:'1.2'},{label:'1.375'},{label:'1.45'},{label:'1.55'},{label:'1.725'}]}),goal=field('เป้าหมาย',profile.goal||'recomposition','select',{choices:[{label:'recomposition'},{label:'cutting'},{label:'bulking'}]});[name,age,gender,height,weight,activity,goal].forEach(f=>body.append(f.wrap));card.append(body);const save=button('บันทึก Profile',async()=>{save.disabled=true;const response=await api('/api/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.input.value.trim(),age:Number(age.input.value),gender:gender.input.value,height_cm:Number(height.input.value),weight_kg:Number(weight.input.value),activity_multiplier:Number(activity.input.value),goal:goal.input.value})});save.disabled=false;if(!response.ok){showToast(await apiError(response));return}profile=(await response.json()).profile||profile;renderProfile();showToast('บันทึก Profile แล้ว');setTab('today')},'button');card.append(save);if(profile.profile_completed){const targets=section('เป้าหมายโภชนาการ');const targetFields=[field('แคลอรี่ต่อวัน (kcal)',profile.daily_target_kcal??0,'number',{min:500,step:1}),field('โปรตีนต่อวัน (g)',profile.target_protein_g??0,'number',{min:0,step:1}),field('คาร์บต่อวัน (g)',profile.target_carbs_g??0,'number',{min:0,step:1}),field('ไขมันต่อวัน (g)',profile.target_fat_g??0,'number',{min:0,step:1})];targetFields.forEach(item=>targets.append(item.wrap));const saveTargets=async(reset=false)=>{const payload={reset_targets:reset};if(!reset){const values=targetFields.map(item=>Number(item.input.value));if(values.some(value=>!Number.isFinite(value)||value<0)||values[0]<500){showToast('ค่าเป้าหมายต้องเป็นตัวเลขที่ไม่ติดลบ และแคลอรี่ต้องอย่างน้อย 500');return}payload.daily_target_kcal=values[0];payload.target_protein_g=values[1];payload.target_carbs_g=values[2];payload.target_fat_g=values[3]}const response=await api('/api/me/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){showToast(await apiError(response));return}profile=(await response.json()).profile||profile;renderProfile();showToast(reset?'ใช้เป้าหมายที่คำนวณใหม่แล้ว':'บันทึกเป้าหมายแล้ว')};const actions=node('div','','actions');actions.append(button('บันทึกเป้าหมาย',()=>saveTargets(false),'button'),button('ใช้ค่าที่คำนวณใหม่',()=>{if(confirm('ต้องการแทนที่ค่าเป้าหมายที่แก้เองด้วยค่าคำนวณใหม่หรือไม่?'))saveTargets(true)},'button secondary'));targets.append(actions);const calculated=node('div','','notice');calculated.textContent=`ค่าคำนวณอ้างอิง: BMR ${Math.round(profile.bmr||0).toLocaleString()} • TDEE ${Math.round(profile.tdee||0).toLocaleString()} kcal`;targets.append(calculated);root.append(card,targets)}else root.append(card)}

  async function loadCapture(captureToken){const response=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}`);if(!response.ok){showToast('รายการอาหารหมดอายุแล้ว');return}const capture=await response.json(),items=capture.items||[],body=document.createElement('div');const render=()=>{body.replaceChildren();items.forEach((item,index)=>{const card=node('div','','card'),name=field('ชื่ออาหาร',item.food_name),portion=field('ปริมาณ',item.portion||'1 ที่'),kcal=field('kcal',item.calories,'number',{min:0,step:.1}),p=field('โปรตีน',item.protein,'number',{min:0,step:.1}),c=field('คาร์บ',item.carbs,'number',{min:0,step:.1}),f=field('ไขมัน',item.fat,'number',{min:0,step:.1});[name,portion,kcal,p,c,f].forEach(x=>card.append(x.wrap));card.append(button('ลบรายการ',()=>{items.splice(index,1);render()},'button danger'));body.append(card)});body.append(button('เพิ่มรายการ',()=>{items.push({food_name:'',portion:'1 ที่',calories:0,protein:0,carbs:0,fat:0});render()},'button secondary'))};render();openModal('ตรวจสอบรายการอาหาร',body,[button('ยกเลิก',async()=>{await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}/cancel`,{method:'POST'});closeModal()}),button('ยืนยันทั้งหมด',async()=>{const payload={items:[...body.querySelectorAll('.card')].map(card=>{const i=card.querySelectorAll('input');return{food_name:i[0].value.trim(),portion:i[1].value.trim()||'1 ที่',calories:Number(i[2].value)||0,protein:Number(i[3].value)||0,carbs:Number(i[4].value)||0,fat:Number(i[5].value)||0}}).filter(item=>item.food_name)};const update=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!update.ok){showToast(await apiError(update));return}const confirmResponse=await api(`/api/me/food-captures/${encodeURIComponent(captureToken)}/confirm`,{method:'POST'});if(!confirmResponse.ok){showToast(await apiError(confirmResponse));return}closeModal();loadToday()},'button')])}
  init();
