<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LINE Cal</title>
  <style>
    :root{color-scheme:light;--bg:#f5f8fc;--card:#fff;--input:#f7faff;--line:#dfe7f2;--text:#17324d;--muted:#6b7d91;--blue:#1769e0;--blue-soft:#eaf2ff;--green:#16a673;--orange:#ee8b24;--red:#d94b5b;--radius:18px;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:calc(78px + var(--safe-bottom))}
    body.modal-open{overflow:hidden}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app-header{position:sticky;top:0;z-index:5;padding:calc(13px + var(--safe-top)) 16px 12px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    h1{margin:0;color:var(--blue);font-size:21px;letter-spacing:-.2px}.subtitle{color:var(--muted);font-size:12px}
    .content{display:none;width:100%;padding:16px;max-width:720px;margin:auto}.content.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:14px;box-shadow:0 5px 18px rgba(41,78,122,.06)}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.section-intro{margin:-5px 0 14px;color:var(--muted);font-size:13px}
    .notice{padding:12px;border-radius:13px;background:var(--blue-soft);color:#315678;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px 8px;border-radius:14px;background:var(--input);text-align:center}.stat strong{display:block;font-size:19px;color:var(--text)}.stat span{display:block;color:var(--muted);font-size:11px}.button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(23,105,224,.18)}.button.secondary{background:var(--input);border:1px solid var(--line);color:var(--text);box-shadow:none}.button.danger{background:#fff0f1;border:1px solid #f3c5ca;color:#b83849;box-shadow:none}.button.link{background:transparent;color:var(--blue);padding:8px 10px;box-shadow:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>.button{flex:0 1 auto}
    .field{margin-bottom:11px;min-width:0}.field label{display:block;color:var(--text);font-size:13px;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-width:0;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--input);color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid rgba(23,105,224,.16);border-color:var(--blue)}.field textarea{min-height:70px;resize:vertical}
    .macro{padding:10px 0;border-bottom:1px solid var(--line)}.macro:last-child{border-bottom:0}.macro-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}.macro-head strong{font-weight:700}.macro-over{color:var(--red)}.progress{height:9px;margin-top:6px;border-radius:9px;overflow:hidden;background:#e8eef6}.progress-fill{height:100%;width:var(--progress,0%);max-width:100%;border-radius:inherit;background:var(--blue);transition:width .25s ease}.progress-fill.over{background:var(--red)}
    .calorie-card{display:grid;grid-template-columns:132px 1fr;align-items:center;gap:17px;padding:6px 0 14px}.calorie-ring{--progress:0%;width:124px;height:124px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--blue) var(--progress),#e8eef6 0);position:relative}.calorie-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}.calorie-ring-content{position:relative;z-index:1;text-align:center}.calorie-ring strong{display:block;font-size:23px;line-height:1.1}.calorie-ring small{display:block;color:var(--muted);font-size:11px}.calorie-copy strong{display:block;font-size:18px}.calorie-copy span{display:block;color:var(--muted);font-size:13px}.exercise-estimate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border-radius:14px;background:#f0fbf7;margin-top:12px}.exercise-estimate strong{color:var(--green);font-size:20px}.exercise-estimate small{display:block;color:#4f7568;font-size:12px}
    .entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry-main{min-width:0;flex:1}.entry-title{font-weight:700;overflow-wrap:anywhere}.entry-meta{color:var(--muted);font-size:12px}.entry-actions{display:flex;gap:5px;flex-shrink:0}.entry-actions .button{min-height:40px}
    .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar .weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{width:100%;min-height:52px;padding:4px 2px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--text);overflow:hidden}.day.empty{background:transparent;border:0}.day.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.day.has-data{background:var(--blue-soft)}.day small{display:block;color:var(--blue);font-size:10px;line-height:1.25;white-space:normal}
    .program{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;background:var(--card)}.program-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.program-head h3{min-width:0;overflow-wrap:anywhere}.program-head .actions{justify-content:flex-end}
    .modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;overflow:auto;padding-top:var(--safe-top);background:rgba(23,50,77,.36)}.modal.open{display:flex}.sheet{display:flex;flex-direction:column;width:100%;max-width:720px;height:min(100dvh,100%);max-height:100dvh;overflow:auto;overscroll-behavior:contain;margin:auto auto 0;padding:20px 16px calc(16px + var(--safe-bottom));background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0}.sheet h2{flex:none;margin:0 0 14px}.sheet>.actions.modal-actions{position:sticky;bottom:calc(-1 * var(--safe-bottom));flex:none;margin:14px -16px calc(-1 * var(--safe-bottom));padding:12px 16px calc(12px + var(--safe-bottom));background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:1}.modal-actions .button{flex:1}
    .toast{position:fixed;z-index:40;left:50%;bottom:calc(78px + var(--safe-bottom));width:min(calc(100% - 32px),520px);transform:translateX(-50%);padding:12px 14px;margin:0;border:1px solid #b9d2f5;border-radius:12px;background:#fff;color:var(--text);box-shadow:0 8px 24px rgba(41,78,122,.18);text-align:center}
    .bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:calc(70px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.98);border-top:1px solid var(--line);max-width:720px;margin:auto}.bottom-nav button{min-width:0;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700}.bottom-nav button.active{color:var(--blue);background:var(--blue-soft)}.bottom-nav span{display:block;font-size:20px}.empty{text-align:center;padding:22px;color:var(--muted)}.loading{text-align:center;padding:36px;color:var(--muted)}
    @media(max-width:480px){.content{padding:12px}.card{padding:13px}.calorie-card{grid-template-columns:112px 1fr;gap:12px}.calorie-ring{width:108px;height:108px}.calorie-ring::after{inset:9px}.calorie-ring strong{font-size:20px}.stats{gap:5px}.stat{padding:10px 4px}.stat strong{font-size:17px}.stat span{font-size:10px}.entry{align-items:flex-start;flex-direction:column}.entry-actions{width:100%;justify-content:flex-end}.entry-actions .button{flex:1;padding:8px}.program-head{align-items:stretch;flex-direction:column}.program-head .actions{width:100%}.program-head .actions .button{flex:1}.actions>.button{flex:1}.calendar{gap:3px}.day{min-height:48px;font-size:12px}.day small{font-size:9px}.sheet{padding-left:13px;padding-right:13px}.sheet>.actions.modal-actions{margin-left:-13px;margin-right:-13px;padding-left:13px;padding-right:13px}.exercise-details{gap:5px}}
    @media(max-width:330px){.content{padding:9px}.card{padding:11px}.calorie-card{grid-template-columns:96px 1fr;gap:8px}.calorie-ring{width:92px;height:92px}.calorie-ring::after{inset:8px}.calorie-ring strong{font-size:17px}.calorie-ring small{font-size:9px}.calorie-copy strong{font-size:15px}.calorie-copy span{font-size:11px}.stat strong{font-size:15px}.stat span{font-size:9px}.button{padding-left:9px;padding-right:9px}}
  </style>
</head>
<body>
  <header class="app-header"><h1>🍽️ CalTrack</h1><div class="subtitle" id="headerDate"></div><div class="subtitle" id="headerUser"></div></header>
  <main>
    <section class="content active" id="tab-today"><div id="todayRoot" class="loading">กำลังโหลดข้อมูลวันนี้...</div></section>
    <section class="content" id="tab-history"><div id="historyRoot" class="loading">กำลังโหลดประวัติ...</div></section>
    <section class="content" id="tab-programs"><div id="programsRoot" class="loading">กำลังโหลดโปรแกรม...</div></section>
    <section class="content" id="tab-profile"><div id="profileRoot" class="loading">กำลังโหลดโปรไฟล์...</div></section>
  </main>
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <button type="button" data-tab="today"><span>📊</span>วันนี้</button>
    <button type="button" data-tab="history"><span>📅</span>ประวัติ</button>
    <button type="button" data-tab="programs"><span>🏋️</span>โปรแกรม</button>
    <button type="button" data-tab="profile"><span>👤</span>โปรไฟล์</button>
  </nav>
  <div class="modal" id="modal" aria-hidden="true"><div class="sheet" id="modalSheet"></div></div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  const CONFIG=window.__LINE_CAL_CONFIG__||{},API=location.origin;
  let params=new URLSearchParams();
  let token='',profile=null,today=null,sessions=[],programs=[],monthly=null,selectedDay=null;
  const aliases={monthly:'history',workout:'programs',workouts:'programs',goals:'profile',goal:'profile'};
  const tabName=value=>aliases[value]||(['today','history','programs','profile'].includes(value)?value:'today');
  const $=id=>document.getElementById(id),text=value=>String(value??'');
  function node(tag,content='',className=''){const el=document.createElement(tag);if(className)el.className=className;if(content instanceof Node)el.append(content);else if(content!==undefined)el.textContent=content;return el}
  function button(label,handler,className='button secondary'){const b=node('button',label,className);b.type='button';b.addEventListener('click',handler);return b}
  function api(path,options={}){const headers=new Headers(options.headers||{});headers.set('Authorization',`Bearer ${token}`);return fetch(API+path,{...options,headers})}
  let toastTimer;
  function showToast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const n=node('div',message,'toast');n.setAttribute('role','status');document.body.append(n);toastTimer=setTimeout(()=>n.remove(),3200)}
  function setTab(raw){const tab=tabName(raw);if(raw!==tab){const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState({},'',u)}document.querySelectorAll('.content').forEach(el=>el.classList.toggle('active',el.id===`tab-${tab}`));document.querySelectorAll('.bottom-nav button').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));if(tab==='today')loadToday();if(tab==='history')loadHistory();if(tab==='programs')loadPrograms();if(tab==='profile')loadProfile()}
  function profileRequired(){if(profile?.profile_completed)return true;setTab('profile');showToast('กรุณาตั้งค่า Profile ให้ครบก่อนบันทึกข้อมูล');return false}
  function openModal(title,body,actions=[]){const sheet=$('modalSheet');sheet.replaceChildren();sheet.append(node('h2',title),body);const row=node('div','','actions modal-actions');actions.forEach(a=>row.append(a));sheet.append(row);document.body.classList.add('modal-open');$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false')}
  function closeModal(){document.body.classList.remove('modal-open');$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');$('modalSheet').replaceChildren()}
  $('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeModal()});
  function field(label,value='',type='text',options={}){const wrap=node('div','','field'),labelNode=node('label',label);const input=document.createElement(type==='select'?'select':type==='textarea'?'textarea':'input');if(options.key)input.dataset.field=options.key;if(type==='select'){for(const option of options.choices||[]){const item=node('option',option.label);item.value=option.value??option.label;input.append(item)}input.value=String(value??'')}else{if(type!=='textarea')input.type=type;input.value=value??'';if(options.step)input.step=options.step;if(options.min!==undefined)input.min=options.min;if(options.max!==undefined)input.max=options.max}wrap.append(labelNode,input);return {wrap,input}}
  function exerciseField(label,value,type,key,options={}){return field(label,value,type,{...options,key})}
  function exerciseEditorRow(exercise,index,handlers={}){const row=node('div','','exercise'),name=exerciseField('ชื่อท่า',exercise.name||'','text','name'),sets=exerciseField('เซ็ต',exercise.sets??3,'number','sets',{min:0}),reps=exerciseField('ครั้ง',exercise.repetitions??10,'number','repetitions',{min:0}),weight=exerciseField('น้ำหนัก (กก.)',exercise.weight??'','number','weight',{min:0,step:.1}),notes=exerciseField('หมายเหตุ',exercise.notes||'','text','notes');name.wrap.classList.add('exercise-name');notes.wrap.classList.add('exercise-notes');const details=node('div','','exercise-details');details.append(sets.wrap,reps.wrap,weight.wrap);const actions=node('div','','exercise-actions');if(handlers.up)actions.append(button('ขึ้น',handlers.up,'button link'));if(handlers.down)actions.append(button('ลง',handlers.down,'button link'));if(handlers.remove)actions.append(button('ลบท่า',handlers.remove,'button danger'));row.append(name.wrap,details,notes.wrap,actions);return row}
  function exerciseValue(row,key){return row.querySelector(`[data-field="${key}"]`)?.value??''}
  function apiError(response){return response.json().catch(()=>({})).then(body=>body.detail||'ดำเนินการไม่สำเร็จ')}
  function bangkokDate(value){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value||Date.now()))}
  function formatTime(value){return value?new Date(value).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}):''}
  function section(title){const card=node('div','','card');card.append(node('h2',title));return card}
  function empty(message){return node('div',message,'empty')}
  function addActions(parent,items){const actions=node('div','','entry-actions');items.forEach(item=>actions.append(item));parent.append(actions)}

  async function init(){
    $('headerDate').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Bangkok'});
    if(!CONFIG.liffId||!window.liff){$('todayRoot').textContent='ต้องเปิด Web App ผ่าน LINE LIFF';return}
    try{await liff.init({liffId:CONFIG.liffId});params=new URLSearchParams(location.search);if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}token=liff.getIDToken();if(!token)throw Error('LINE identity token unavailable');profile=await (await api('/api/me/profile')).json();$('headerUser').textContent=profile.name?`ผู้ใช้: ${profile.name}`:'';setTab(params.get('tab')||'today');if(params.get('capture_token'))loadCapture(params.get('capture_token'));if(params.get('cardio')==='1')openCardio()}catch(error){console.error(error);$('todayRoot').textContent='ยืนยันตัวตนไม่สำเร็จ กรุณาเปิดหน้านี้จาก LINE'}}
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

  function renderToday(data,sessionRows){const root=$('todayRoot');root.replaceChildren();const summary=section('วันนี้');const consumed=Number(data.food_consumed)||0,target=Number(data.food_target)||0,remaining=Number(data.remaining_kcal)||0,caloriePercent=target>0?Math.min(100,Math.max(0,(consumed/target)*100)):0;const calorieCard=node('div','','calorie-card'),ring=node('div','','calorie-ring');ring.style.setProperty('--progress',`${caloriePercent}%`);const ringContent=node('div','','calorie-ring-content');ringContent.append(node('strong',Math.round(consumed).toLocaleString()),node('small','kcal ที่กิน'));ring.append(ringContent);const calorieCopy=node('div','','calorie-copy');calorieCopy.append(node('span','เป้าหมายอาหารต่อวัน'),node('strong',target>0?`${Math.round(target).toLocaleString()} kcal`:'ยังไม่ได้ตั้งเป้า'),node('span',target>0?(remaining>=0?`เหลือ ${Math.round(remaining).toLocaleString()} kcal`:`เกินเป้า ${Math.abs(Math.round(remaining)).toLocaleString()} kcal`):'ตั้งค่า Profile เพื่อคำนวณเป้าหมาย'));calorieCard.append(ring,calorieCopy);summary.append(calorieCard);const exercise=node('div','','exercise-estimate'),exerciseCopy=node('div');exerciseCopy.append(node('small','ออกกำลังกาย (ประมาณ)'),node('strong',`${Math.round(Number(data.exercise_estimate)||0).toLocaleString()} kcal`));exercise.append(node('span','🏃'),exerciseCopy);summary.append(exercise);summary.append(node('h3','สารอาหารวันนี้'));const macroValues=[['โปรตีน',data.protein,data.target_protein],['คาร์บ',data.carbs,data.target_carbs],['ไขมัน',data.fat,data.target_fat]];macroValues.forEach(([label,value,targetValue])=>{const actual=Number(value)||0,goal=Number(targetValue)||0,percent=goal>0?Math.min(100,Math.max(0,(actual/goal)*100)):0,m=node('div','','macro'),head=node('div','','macro-head'),fill=node('div','','progress-fill');head.append(node('strong',label),node('span',goal>0?`${Math.round(actual)} / ${Math.round(goal)} g`:`${Math.round(actual)} g`));fill.style.setProperty('--progress',`${percent}%`);if(goal>0&&actual>goal)fill.classList.add('over');const bar=node('div','','progress');bar.append(fill);m.append(head,bar);summary.append(m)});root.append(summary);
    const foods=section('รายการอาหาร');if(!data.food_logs?.length)foods.append(empty('ยังไม่มีรายการอาหารวันนี้\nส่งรูปหรือพิมพ์ “กิน <เมนู>” ใน LINE'));else data.food_logs.forEach(food=>foods.append(foodRow(food)));root.append(foods);
    const workouts=section('การออกกำลังกาย');const controls=node('div','','actions');controls.append(button('เลือกโปรแกรม',()=>{if(profileRequired())setTab('programs')},'button'));controls.append(button('บันทึก Cardio',()=>{if(profileRequired())openCardio()},'button secondary'));workouts.append(controls);const todaySessions=sessionRows.filter(s=>bangkokDate(s.occurred_at)===bangkokDate(new Date().toISOString()));if(!todaySessions.length)workouts.append(empty('ยังไม่มี Workout Session วันนี้'));else todaySessions.forEach(session=>workouts.append(sessionRow(session)));root.append(workouts)}
  function foodRow(food){const row=node('div','','entry'),main=node('div','','entry-main');main.append(node('div',food.name||'รายการอาหาร','entry-title'),node('div',`${food.time||''} • ${Math.round(food.calories||0)} kcal • P ${Math.round(food.protein||0)}g`,'entry-meta'));row.append(main);addActions(row,[button('แก้ไข',()=>openFoodEditor(food),'button link'),button('ลบ',()=>deleteFood(food.id),'button danger')]);return row}
  function sessionRow(session){const row=node('div','','entry'),main=node('div','','entry-main');main.append(node('div',`${session.type==='cardio'?'🏃':'🏋️'} ${session.name}`,'entry-title'),node('div',`${formatTime(session.occurred_at)} • ${Math.round(session.estimated_duration_min||0)} นาที • ประมาณ ${Math.round(session.estimated_calories||0)} kcal`,'entry-meta'));row.append(main);addActions(row,[button('แก้ไข',()=>openSessionEditor(session.id),'button link'),button('ลบ',()=>deleteSession(session.id),'button danger')]);return row}
  async function loadToday(){if(!token)return;const root=$('todayRoot');root.textContent='กำลังโหลดข้อมูลวันนี้...';try{const [summaryResponse,sessionResponse]=await Promise.all([api('/api/me/today'),api('/api/me/workout-sessions?limit=200')]);if(summaryResponse.status===409){profileRequired();return}if(!summaryResponse.ok)throw Error(await apiError(summaryResponse));today=await summaryResponse.json();sessions=sessionResponse.ok?(await sessionResponse.json()).sessions||[]:[];renderToday(today,sessions)}catch(error){root.textContent=`โหลดข้อมูลไม่สำเร็จ: ${error.message}`}}
  async function deleteFood(id){if(!confirm('ลบรายการอาหารนี้หรือไม่?'))return;const response=await api(`/api/me/food/${id}`,{method:'DELETE'});if(!response.ok){showToast(await apiError(response));return}loadToday();if(monthly)loadHistory()}
  function openFoodEditor(food){const body=document.createElement('div');const name=field('ชื่ออาหาร',food.name),portion=field('ปริมาณ',food.portion||'1 ที่'),kcal=field('แคลอรี',food.calories,'number',{min:0,step:.1}),protein=field('โปรตีน (g)',food.protein,'number',{min:0,step:.1}),carbs=field('คาร์บ (g)',food.carbs,'number',{min:0,step:.1}),fat=field('ไขมัน (g)',food.fat,'number',{min:0,step:.1});[name,portion,kcal,protein,carbs,fat].forEach(f=>body.append(f.wrap));openModal('แก้ไขรายการอาหาร',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const response=await api(`/api/me/food/${food.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({food_name:name.input.value,portion:portion.input.value,calories:Number(kcal.input.value),protein:Number(protein.input.value),carbs:Number(carbs.input.value),fat:Number(fat.input.value)})});if(!response.ok){showToast(await apiError(response));return}closeModal();loadToday();if(monthly)loadHistory()},'button')])}

  let historyYear=new Date().getFullYear(),historyMonth=new Date().getMonth()+1;
  async function loadHistory(){if(!token)return;const root=$('historyRoot');root.textContent='กำลังโหลดประวัติ...';try{const [monthResponse,sessionResponse]=await Promise.all([api(`/api/me/monthly?year=${historyYear}&month=${historyMonth}`),api('/api/me/workout-sessions?limit=200')]);if(monthResponse.status===409){profileRequired();return}if(!monthResponse.ok)throw Error(await apiError(monthResponse));monthly=await monthResponse.json();sessions=sessionResponse.ok?(await sessionResponse.json()).sessions||[]:sessions;renderHistory()}catch(error){root.textContent=`โหลดประวัติไม่สำเร็จ: ${error.message}`}}
  function renderHistory(){const root=$('historyRoot');root.replaceChildren();const card=section('ประวัติ');const head=node('div','','actions');head.style.justifyContent='space-between';head.append(button('เดือนก่อน',()=>{historyMonth--;if(historyMonth<1){historyMonth=12;historyYear--}loadHistory()}),node('strong',new Date(historyYear,historyMonth-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'})),button('เดือนถัดไป',()=>{historyMonth++;if(historyMonth>12){historyMonth=1;historyYear++}loadHistory()}));card.append(head);const cal=node('div','','calendar');['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(day=>cal.append(node('div',day,'weekday')));const days=monthly?.daily_breakdown||[];const first=new Date(historyYear,historyMonth-1,1).getDay();for(let i=0;i<first;i++)cal.append(node('div','','day empty'));days.forEach(day=>{const foodCount=day.food_logs?.length||0,daySessions=sessions.filter(s=>bangkokDate(s.occurred_at)===day.date),sessionCount=daySessions.length;const cell=button(String(Number(day.date.slice(-2))),()=>selectHistoryDay(day),'day');if(foodCount||sessionCount)cell.classList.add('has-data');cell.append(node('small',`🍽 ${foodCount} · 🏋 ${sessionCount}`));if(selectedDay===day.date)cell.classList.add('selected');cal.append(cell)});card.append(cal);root.append(card);if(selectedDay){const day=days.find(item=>item.date===selectedDay);if(day)root.append(renderHistoryDay(day))}}

  async function openSessionEditor(id){const response=await api(`/api/me/workout-sessions/${id}`);if(!response.ok){showToast(await apiError(response));return}const session=await response.json();const body=document.createElement('div');const name=field('ชื่อ Session',session.name),duration=field('ระยะเวลาโดยประมาณ (นาที)',session.estimated_duration_min,'number',{min:0,step:.1}),calories=field('พลังงานโดยประมาณ (แก้ได้)',session.estimated_calories,'number',{min:0,step:.1}),notes=field('หมายเหตุ',session.notes||'','textarea');[name,duration,calories,notes].forEach(f=>body.append(f.wrap));const exercises=node('div');session.exercises=session.exercises||[];const renderExercises=()=>{exercises.replaceChildren();if(session.type!=='strength'){exercises.append(node('div','Cardio แก้ไขได้จากค่าเวลาและพลังงานด้านบน','muted'));return}session.exercises.forEach((exercise,index)=>{exercises.append(exerciseEditorRow(exercise,index,{remove:()=>{session.exercises.splice(index,1);renderExercises()}}))})};body.append(node('h3','ท่าออกกำลังกาย'));renderExercises();body.append(exercises);if(session.type==='strength')body.append(button('เพิ่มท่า',()=>{session.exercises.push({name:'',sets:3,repetitions:10,weight:null,notes:''});renderExercises()},'button secondary'));openModal('แก้ไข Workout Session',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const exercisesPayload=[...exercises.querySelectorAll('.exercise')].map(row=>({name:exerciseValue(row,'name').trim(),sets:Number(exerciseValue(row,'sets'))||0,repetitions:Number(exerciseValue(row,'repetitions'))||0,weight:exerciseValue(row,'weight')===''?null:Number(exerciseValue(row,'weight')),notes:exerciseValue(row,'notes').trim()})).filter(item=>item.name);const payload={name:name.input.value.trim(),notes:notes.input.value,estimated_duration_min:Number(duration.input.value)||0,estimated_calories:Number(calories.input.value)||0};if(session.type==='strength')payload.exercises=exercisesPayload;else if(session.cardio)payload.cardio={.   async function loadPrograms(){if(!token)return;const root=$('programsRoot');root.textContent='กำลังโหลดโปรแกรม...';try{const response=await api('/api/me/workout-programs');if(response.status===409){profileRequired();return}if(!response.ok)throw Error(await apiError(response));programs=(await response.json()).programs||[];renderPrograms()}catch(error){root.textContent=`โหลดโปรแกรมไม่สำเร็จ: ${error.message}`}}
  function renderPrograms(){const root=$('programsRoot');root.replaceChildren();const heading=section('Programs');heading.append(node('div','เลือกโปรแกรมเพื่อบันทึกทันที หรือแก้ไขรายการท่าได้ที่นี่','muted'),button('สร้างโปรแกรม',()=>openProgramEditor(),'button'),button('บันทึก Cardio',()=>{if(profileRequired())openCardio()},'button secondary'));root.append(heading);if(!programs.length){root.append(empty('ยังไม่มีโปรแกรม'));return}programs.forEach(program=>root.append(programCard(program)))}

  function openProgramEditor(program=null){const draft=JSON.parse(JSON.stringify(program||{name:'โปรแกรมใหม่',exercises:[]})),body=document.createElement('div'),name=field('ชื่อโปรแกรม',draft.name),list=node('div');body.append(name.wrap,node('p','กำหนดชื่อท่า เซ็ต ครั้ง น้ำหนัก และหมายเหตุ','muted'),list);renderProgramExercises(draft.exercises,list);body.append(button('เพิ่มท่า',()=>{draft.exercises.push({name:'',sets:3,repetitions:10,weight:null,notes:''});renderProgramExercises(draft.exercises,list)},'button secondary'));openModal(program?'แก้ไขโปรแกรม':'สร้างโปรแกรม',body,[button('ยกเลิก',closeModal),button('บันทึก',async()=>{const payload={name:name.input.value.trim(),exercises:[...list.querySelectorAll('.exercise')].map(row=>({name:exerciseValue(row,'name').trim(),sets:Number(exerciseValue(row,'sets'))||0,repetitions:Number(exerciseValue(row,'repetitions'))||0,weight:exerciseValue(row,'weight')===''?null:Number(exerciseValue(row,'weight')),notes:exerciseValue(row,'notes').trim()})).filter(item=>item.name)};if(!payload.name){showToast('กรุณาระบุชื่อโปรแกรม');return}const response=await api(program?`/api/me/workout-programs/${program.id}`:'/api/me/workout-programs',{method:program?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){showToast(await apiError(response));return}closeModal();loadPrograms()},'button')])}
